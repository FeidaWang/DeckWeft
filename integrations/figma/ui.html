<!doctype html><html lang="en"><meta charset="utf-8"><style>body{font:13px Arial,sans-serif;padding:20px;color:#26302a;background:#f8f5ee}h1{font:28px Georgia,serif}p{line-height:1.6}button{background:#26302a;color:#fff;border:0;padding:12px;border-radius:8px}pre{white-space:pre-wrap;font:inherit;line-height:1.5}</style><h1>DeckWeft</h1><p>Pick the <b>.figma.json</b> file you exported. It becomes editable text, shapes and individual PNG media on this page. No image flattening. No network upload by this plugin.</p><input id="file" type="file" accept=".json"><p lang="zh-CN">选择导出的 .figma.json 文件，转换为可编辑的文字和形状。</p><p><label><input type="checkbox" id="fallback">Allow missing fonts to be replaced with Inter</label></p><button id="cancel">Cancel current import</button><button id="report" disabled>Save import report</button><button id="import">Import editable frames</button><pre id="result" role="status"></pre><script>
let bundle,report;const result=document.getElementById('result');document.getElementById('file').onchange=async event=>{try{const file=event.target.files[0];if(file.size>24000000)throw Error('Use a file smaller than 24 MB.');bundle=JSON.parse(await file.text());result.textContent='Ready to import.';}catch(e){bundle=null;result.textContent=e.message;}};document.getElementById('import').onclick=()=>{if(!bundle){result.textContent='Choose a JSON file first.';return;}parent.postMessage({pluginMessage:{type:'import',bundle,allowFontFallback:document.getElementById('fallback').checked}},'*');result.textContent='Creating editable layers…';};document.getElementById('cancel').onclick=()=>parent.postMessage({pluginMessage:{type:'cancel'}},'*');document.getElementById('report').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='deckweft-figma-import-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};onmessage=event=>{if(event.source!==parent)return;const m=event.data.pluginMessage;if(m?.report){report=m.report;document.getElementById('report').disabled=false;}if(m)result.textContent=m.message+'\n'+(m.warnings||[]).join('\n');};
</script></html>
